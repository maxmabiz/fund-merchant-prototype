  <script>
    const spec = JSON.parse(document.getElementById("payload").textContent);
    const keyName = "fund-mm-pass";
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    async function openWith(password) {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(spec.salt), iterations: spec.iter, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(spec.iv) }, key, b64(spec.data));
      sessionStorage.setItem(keyName, password);
      const html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    }
    document.getElementById("gate").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("enter");
      const error = document.getElementById("error");
      const password = document.getElementById("password").value;
      error.textContent = "";
      button.disabled = true;
      try {
        await openWith(password);
      } catch (err) {
        sessionStorage.removeItem(keyName);
        error.textContent = "密码不正确";
        button.disabled = false;
      }
    });
    const saved = sessionStorage.getItem(keyName);
    if (saved) openWith(saved).catch(() => sessionStorage.removeItem(keyName));
  </script>
